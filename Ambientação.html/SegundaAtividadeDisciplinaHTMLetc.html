  border: 2px solid #333;

  cursor: pointer;
}
</style>
</head>
<body>
  <burron onclick="mudarCor()">Mudar Cor de Fundo</burron>

<script>
function mudarCor(){
const cores = ["#FF5733", "#33FF57", "#3357FF", "#F3FF33", "#9B59B6", "#1ABC9c"];

const corAleatoria = cores[Math.floor(Math.random() * cores.length)];
  document.body.style.backgroundColor = corAleatoria;
}
